reset_alarm:
  name: Reset one alarm
  description: Acknowledge one CTS602 alarm. The value written is 100 plus the alarm code. Protocol 9 only.
  fields:
    entry_id:
      name: Config entry
      required: true
      selector:
        config_entry:
          integration: nilan_cts602
    code:
      name: Alarm code
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box
