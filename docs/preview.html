<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nilan CTS602</title>
  <style>
    html, body { margin: 0; }
    body { padding: 12px; }
    #stage { width: min(100%, var(--card-width, 390px)); margin: 0 auto; }
    html[data-theme="dark"] { background: #0e1116; color-scheme: dark; }
    html[data-theme="light"] {
      background: #e7ebf0;
      color-scheme: light;
      --ha-card-background: #f4f7fa;
      --card-background-color: #ffffff;
      --primary-text-color: #1b2430;
      --secondary-text-color: #5c6b7a;
      --divider-color: #d5dde6;
      --secondary-background-color: #eef2f6;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="../custom_components/nilan_cts602/frontend/nilan-plant.js"></script>
  <script src="../custom_components/nilan_cts602/frontend/nilan-diagram.js"></script>
  <script src="../custom_components/nilan_cts602/frontend/nilan-chart.js"></script>
  <script src="../custom_components/nilan_cts602/frontend/nilan-wizard.js"></script>
  <script src="../custom_components/nilan_cts602/frontend/nilan-settings.js"></script>
  <script src="../custom_components/nilan_cts602/frontend/nilan-card.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const themeParam = params.get('theme') || 'light';
    const theme = ['light', 'dark', 'auto'].includes(themeParam) ? themeParam : 'light';
    const darkPage = theme === 'dark' || (theme === 'auto' && params.get('dark') === '1');
    const layout = params.get('layout') === 'mobile' ? 'mobile' : 'desktop';
    const tab = params.get('tab') || 'overview';
    document.documentElement.dataset.theme = darkPage ? 'dark' : 'light';
    document.documentElement.style.setProperty('--card-width', layout === 'desktop' ? '1120px' : '390px');

    const LABELS = {
      ventilation: 'Ventilation', auto: 'Auto', heat: 'Varme', cool: 'Køl', on: 'Til', off: 'Fra',
      none: 'Ingen', program_1: 'Udearbejdende', program_2: 'Hjemmegående', program_3: 'Erhverv',
      unknown: 'Ukendt', extend: 'Forlæng', inlet: 'Indblæs', plus_2: '+2 °C', filter: 'Filter',
    };

    function entity(key, state, extra) {
      const id = `sensor.nilan_${key}`;
      return [id, {
        entity_id: id,
        state: String(state),
        attributes: Object.assign({
          nilan_device: 'nilan-comfort',
          register_key: key,
          friendly_name: key,
          sw_version: '2.35.a',
          protocol_version: 9,
          slave_id: 10,
        }, extra || {}),
      }];
    }

    const states = Object.fromEntries([
      entity('t0_controller', '28.4', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Styrekort (T0)' }),
      entity('t3_extract', '22.1', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Fraluft (T3)' }),
      entity('t4_exhaust', '14.8', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Afkast (T4)' }),
      entity('t7_supply', '19.4', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Tilluft (T7)' }),
      entity('t8_outdoor', '12.3', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Udeluft (T8)' }),
      entity('t15_panel', '18.6', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Panel (T15)' }),
      entity('humidity', '45', { unit_of_measurement: '%', device_class: 'humidity', friendly_name: 'Fugtighed' }),
      entity('control_state', 'ventilation', { device_class: 'enum', friendly_name: 'Driftstilstand' }),
      entity('operation_mode', 'auto', { device_class: 'enum', friendly_name: 'Driftform' }),
      entity('supply_setpoint', '21.0', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Indblæsningssetpunkt' }),
      entity('supply_fan_speed', '40', { unit_of_measurement: '%', friendly_name: 'Tilluft ventilator' }),
      entity('extract_fan_speed', '42', { unit_of_measurement: '%', friendly_name: 'Fraluft ventilator' }),
      entity('fan_step', '2', { friendly_name: 'Aktuelt ventilatortrin' }),
      entity('filter_days_since', '48', { unit_of_measurement: 'd', friendly_name: 'Dage siden filterskift' }),
      entity('filter_days_left', '42', { unit_of_measurement: 'd', friendly_name: 'Dage til filterskift' }),
      entity('alarm_count', '0', { friendly_name: 'Antal alarmer' }),
      entity('efficiency', '74.5', { unit_of_measurement: '%', friendly_name: 'Varmegenvinding' }),
      entity('room_temperature', '21.4', { unit_of_measurement: '°C', device_class: 'temperature', friendly_name: 'Rumtemperatur' }),
      entity('running', 'on', { friendly_name: 'Kører' }),
      entity('summer', 'off', { friendly_name: 'Sommer' }),
      entity('alarm_active', 'off', { friendly_name: 'Alarm aktiv' }),
      entity('filter', 'off', { friendly_name: 'Filteralarm' }),
      entity('bypass', 'off', { friendly_name: 'Bypass åben', position: 'closed' }),
      entity('protocol_version', '9', { friendly_name: 'Protokol' }),
      entity('sw_version', '2.35.a', { friendly_name: 'Software' }),
      entity('set_temperature', '21.0', { unit_of_measurement: '°C', device_class: 'temperature' }),
      entity('ctrl_run', 'on', { device_class: 'enum' }),
      entity('ctrl_mode', 'auto', { device_class: 'enum' }),
      entity('ctrl_fan_step', '2', {}),
      entity('ctrl_temperature', '21.5', { unit_of_measurement: '°C', device_class: 'temperature' }),
      entity('ctrl_supply_min_summer', '13', { unit_of_measurement: '°C' }),
      entity('ctrl_supply_min_winter', '16', { unit_of_measurement: '°C' }),
      entity('ctrl_summer_limit', '13', { unit_of_measurement: '°C' }),
      entity('ctrl_user1_function', 'extend', { device_class: 'enum' }),
      entity('ctrl_user1_time', '120', { unit_of_measurement: 'min' }),
      entity('ctrl_user1_step', '2', {}),
      entity('ctrl_rh_low', '1', {}),
      entity('ctrl_rh_limit', '30', { unit_of_measurement: '%' }),
      entity('ctrl_rh_high', '3', {}),
      entity('ctrl_rh_time', '30', { unit_of_measurement: 'min' }),
      entity('ctrl_week', 'program_1', { device_class: 'enum' }),
      entity('ctrl_cool_vent', '2', {}),
      entity('ctrl_cool_set', 'plus_2', { device_class: 'enum' }),
      entity('ctrl_night_day', '0', { unit_of_measurement: '°C' }),
      entity('ctrl_night_set', '18', { unit_of_measurement: '°C' }),
    ]);

    const hass = {
      language: 'da',
      themes: { darkMode: darkPage },
      user: { id: 'preview', is_admin: params.get('admin') !== '0', name: 'Michael' },
      states,
      formatEntityState(stateObj) {
        const raw = String(stateObj.state);
        if (LABELS[raw] && (stateObj.attributes.device_class === 'enum' || Number.isNaN(Number(raw)))) return LABELS[raw];
        const value = Number(raw.replace(',', '.'));
        if (!Number.isFinite(value)) return raw;
        const digits = raw.includes('.') ? 1 : 0;
        let text = value.toFixed(digits).replace('.', ',');
        const unit = stateObj.attributes.unit_of_measurement;
        return unit ? `${text} ${unit}` : text;
      },
      callWS(msg) {
        if (msg.type === 'config/entity_registry/get') return Promise.resolve({ config_entry_id: 'preview-entry' });
        if (msg.type === 'history/history_during_period' || msg.type === 'recorder/statistics_during_period') return Promise.resolve({});
        return Promise.resolve({});
      },
      callService() { return Promise.resolve(); },
    };

    const card = document.createElement('nilan-cts602-card');
    document.getElementById('stage').append(card);
    const plant = {
      version: 2,
      preheater: false,
      reheater: 'none',
      reheater_electric: false,
      reheater_water: false,
      options_board: false,
      co2: false,
      t10: false,
      experimental: params.get('experimental') === '1',
      room_source: 'entity',
      room_entity: '',
    };
    card.setConfig({
      language: 'da',
      theme,
      layout,
      tab,
      plant,
      preview: true,
      demoConfirm: params.get('confirm') === '1',
    });
    card.hass = hass;

    function whenReady(fn) {
      const started = Date.now();
      const tick = () => {
        const root = card.shadowRoot;
        const ready = root && (root.querySelector('svg') || root.querySelector('section') || root.querySelector('.dialog'));
        if ((ready && root.querySelector('footer')) || Date.now() - started > 2500) fn();
        else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    whenReady(() => {
      document.body.dataset.ready = '1';
      if (params.get('measure') === '1') {
        const svg = card.shadowRoot.querySelector('svg');
        const box = svg.viewBox.baseVal;
        const scale = svg.getBoundingClientRect().width / box.width;
        const sample = (selector) => {
          const node = svg.querySelector(selector);
          const size = Number(getComputedStyle(node).fontSize.replace('px', ''));
          return { raw: size, rendered: Math.round(size * scale * 10) / 10 };
        };
        document.body.dataset.measure = JSON.stringify({
          svg: Math.round(svg.getBoundingClientRect().width),
          temp: sample('.duct-temp'),
          badge: sample('.sensor-label'),
          fan: sample('.fan-speed'),
          bypass: sample('.tag'),
        });
      }
    });
  </script>
</body>
</html>
